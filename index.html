<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Masuk | Sistem Pemantauan Pemulihan Bekalan Air PD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a', 950: '#172554' }, enterprise: { dark: '#0B1120', card: '#111827', border: '#1F2937' } } } } }
    </script>
    <style>
        body { background-color: #0B1120; background-image: radial-gradient(at 0% 0%, hsla(217, 100%, 15%, 0.4) 0px, transparent 50%), radial-gradient(at 100% 100%, hsla(217, 100%, 15%, 0.4) 0px, transparent 50%); background-attachment: fixed; color: #f3f4f6; }
        .bg-grid { background-size: 40px 40px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px); position: absolute; inset: 0; z-index: -1; }
        input:-webkit-autofill { -webkit-box-shadow: 0 0 0 30px #1F2937 inset !important; -webkit-text-fill-color: white !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased relative overflow-hidden">
    <div class="bg-grid"></div>
    <div class="w-full max-w-md relative z-10">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-brand-900/50 border border-brand-500/30 mb-6 shadow-[0_0_15px_rgba(37,99,235,0.2)]">
                <i class="ph ph-drop text-3xl text-brand-500"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white mb-2">SISTEM PEMANTAUAN<br>PEMULIHAN BEKALAN AIR<br>PORT DICKSON</h1>
        </div>

        <div class="bg-enterprise-card border border-enterprise-border rounded-2xl shadow-2xl p-8 relative overflow-hidden">
            <div class="mb-6 flex items-center gap-2 border-b border-gray-800 pb-4">
                <i class="ph ph-shield-check text-gray-400"></i>
                <h2 class="text-sm font-semibold text-gray-300 tracking-wider uppercase">Field Login</h2>
            </div>
            <div id="error-message" class="hidden mb-6 p-4 bg-red-900/20 border border-red-500/30 rounded-lg flex items-center gap-3">
                <i class="ph ph-warning-circle text-red-400 text-lg"></i>
                <p class="text-sm text-red-400 font-medium" id="error-text">Username atau password tidak sah.</p>
            </div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1.5">Username / User ID</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="ph ph-user text-gray-500 text-lg"></i></div>
                        <input type="text" id="username" required class="block w-full pl-10 pr-3 py-3 bg-gray-800 border border-gray-700 rounded-lg text-white focus:ring-2 focus:ring-brand-500" placeholder="Masukkan ID Pengguna">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1.5">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="ph ph-lock-key text-gray-500 text-lg"></i></div>
                        <input type="password" id="password" required class="block w-full pl-10 pr-10 py-3 bg-gray-800 border border-gray-700 rounded-lg text-white focus:ring-2 focus:ring-brand-500" placeholder="••••••••">
                        <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-300"><i class="ph ph-eye text-lg" id="eye-icon"></i></button>
                    </div>
                </div>
                <button type="submit" id="submit-btn" class="w-full flex items-center justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-brand-600 hover:bg-brand-500 transition-all mt-4 group">
                    <span id="btn-text" class="flex items-center gap-2">LOG MASUK <i class="ph ph-sign-in group-hover:translate-x-1 transition-transform"></i></span>
                </button>
            </form>
        </div>
    </div>

    <script>
        // URL Cloudflare anda telah dimasukkan siap-siap di sini
        const API_URL = "https://sains-pd-api.apiz1335.workers.dev";

        document.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('pd_water_auth_token')) window.location.href = 'index_dashboard.html';
        });

        document.getElementById('toggle-password').addEventListener('click', () => {
            const passInput = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (passInput.type === 'password') { passInput.type = 'text'; icon.classList.replace('ph-eye', 'ph-eye-slash'); } 
            else { passInput.type = 'password'; icon.classList.replace('ph-eye-slash', 'ph-eye'); }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnText = document.getElementById('btn-text');
            const errorMsg = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            
            errorMsg.classList.add('hidden');
            btnText.innerText = "MEMPROSES...";

            try {
                const payload = { action: "login", username: document.getElementById('username').value.trim(), password: document.getElementById('password').value };
                const response = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
                const data = await response.json();
                
                if (data.success) {
                    sessionStorage.setItem('pd_water_auth_token', data.token);
                    window.location.href = 'index_dashboard.html';
                } else {
                    errorText.innerText = data.error || "Username atau password tidak sah.";
                    errorMsg.classList.remove('hidden');
                    btnText.innerHTML = 'LOG MASUK <i class="ph ph-sign-in"></i>';
                }
            } catch (error) {
                errorText.innerText = "Ralat pelayan. Sila cuba sebentar lagi.";
                errorMsg.classList.remove('hidden');
                btnText.innerHTML = 'LOG MASUK <i class="ph ph-sign-in"></i>';
            }
        });
    </script>
</body>
</html>
